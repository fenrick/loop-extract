name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Opens and maintains a release pull request. Merging it tags the release and
  # publishes a GitHub Release; the jobs below then attach the binaries.
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

  # One archive per target, with a SHA-256 checksum beside it.
  binaries:
    name: ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    # Only consulted when building the matching target, so it is harmless on
    # the other legs.
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-latest, apt: "gcc-aarch64-linux-gnu libc6-dev-arm64-cross" }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The cross compiler only *recommends* the target C library, so the
      # library has to be named explicitly alongside it: without it the linker
      # reports "cannot find crti.o" and "cannot find -lc".
      - name: Install cross toolchain
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.apt }}

      - name: Keep runner paths out of the binary
        shell: bash
        run: |
          # Panic messages otherwise embed the runner's home directory, which
          # reaches every published binary via the toolchain and registry paths
          # baked in by file!(). CONTRIBUTING.md documents the same step for
          # local release builds.
          if [ "$RUNNER_OS" = "Windows" ]; then
            home=$(cygpath -w "$HOME")
          else
            home="$HOME"
          fi
          echo "RUSTFLAGS=--remap-path-prefix=$home=." >> "$GITHUB_ENV"


      # Builds, archives (.tar.gz on Unix, .zip on Windows), checksums and
      # uploads to the release in one step.
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: loop-extract
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          include: LICENSE,README.md,FORMAT-NOTES.md,CHANGELOG.md
          checksum: sha256
          ref: refs/tags/${{ needs.release-please.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Debian and RPM packages, for the distributions that want one.
  linux-packages:
    name: Linux packages (${{ matrix.arch }})
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
    strategy:
      # One architecture failing must not cost the release the other's packages.
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, arch: amd64 }
          - { target: aarch64-unknown-linux-gnu, arch: arm64, apt: "gcc-aarch64-linux-gnu libc6-dev-arm64-cross" }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The cross compiler only *recommends* the target C library, so the
      # library has to be named explicitly alongside it: without it the linker
      # reports "cannot find crti.o" and "cannot find -lc".
      - name: Install cross toolchain
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ${{ matrix.apt }}

      - name: Keep runner paths out of the binary
        shell: bash
        run: |
          # Panic messages otherwise embed the runner's home directory, which
          # reaches every published binary via the toolchain and registry paths
          # baked in by file!(). CONTRIBUTING.md documents the same step for
          # local release builds.
          if [ "$RUNNER_OS" = "Windows" ]; then
            home=$(cygpath -w "$HOME")
          else
            home="$HOME"
          fi
          echo "RUSTFLAGS=--remap-path-prefix=$home=." >> "$GITHUB_ENV"

      - name: Install packaging tools
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build .deb and .rpm
        run: |
          cargo deb --no-build --target ${{ matrix.target }} --output dist/
          cargo generate-rpm --target ${{ matrix.target }} --output dist/

      - name: Checksums
        working-directory: dist
        run: |
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag }}" dist/* --clobber
